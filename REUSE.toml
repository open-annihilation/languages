# Files that carry no SPDX header of their own. A file's own header takes
# precedence. '*' matches within one directory and '**' across directories.
version = 1

[[annotations]]
path = [
    "*.md",
    "**.md",
    "COPYRIGHT",
    "LICENSE",
    "fonts/*.json",
    "*/files/**",
    "*/warmup.txt",
    "**/warmup.txt",
]
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The missing-header fixture omits its header on purpose: the pack checker
# must fail it. The annotation is what records the file's terms.
[[annotations]]
path = "tests/fixtures/missing-header/translate.tdf"
SPDX-FileCopyrightText = "The Open Annihilation Authors; see COPYRIGHT"
SPDX-License-Identifier = "GPL-3.0-only"

# The CJK face is cut from Noto Sans CJK, which is under the SIL Open Font
# License 1.1. The text in fonts/ is that licence.
[[annotations]]
path = "fonts/*.txt"
SPDX-FileCopyrightText = "Copyright 2014-2021 Adobe (http://www.adobe.com/)"
SPDX-License-Identifier = "OFL-1.1"
